# Database settings are NOT here: they come from the MYSQL_* environment variables
# (MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE, MYSQL_POOL_SIZE),
# loaded from the project-root .env (see .env.example) or the file named by PIPELINE_ENV_FILE.
# Output folder, header and CSV file name, and Invoice API login credentials come
# from the interfaceconfiguration row (see README section 4).

Logging:
  Level: INFO

InvoiceApi:
  BaseUri: https://gatewayinternal.testapps.com   # per-interface override: Platform_InstanceUrl

  Authentication:
    Endpoint: /api/v2/Authenticate

  GetInvoice:
    Endpoint: /api/v2/invoices
    InvoiceStatus: Approved
    PageSize: 50
    Expand: true

  # LookbackDays widens the fromDate/toDate window so a batch created near a
  # run boundary isn't missed.
  GetPaymentBatches:
    Endpoint: /api/v2/invoices/invoiceAPBatches
    PageSize: 50
    LookbackDays: 1

  GetInvoiceList:
    Endpoint: /api/v2/invoices/invoiceAPBatchesDetails
    PageSize: 50
    Expand: true
